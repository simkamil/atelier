name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows MSVC, tests and quality
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust stable components
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy --target x86_64-pc-windows-msvc
      - name: Select Rust stable
        run: rustup default stable
      - name: Bootstrap workspace lock guard
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force target | Out-Null
          rustc --edition=2024 tools/check-workspace/src/main.rs -o target/check-workspace.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check workspace lock
        run: .\target\check-workspace.exe .
      - name: Verify independent DOCX reference fixture
        run: python tools/generate-docx-reference.py --check
      - name: Verify offline symbol and license data
        run: |
          python tools/package-editor-utilities.py --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/editor-utilities-data.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify CFB references with native Structured Storage
        run: python tools/generate-cfb-reference.py --check
      - name: Build Windows MSVC workspace
        run: cargo build --workspace --target x86_64-pc-windows-msvc --locked --offline
      - name: Check font and image resource integrity
        shell: pwsh
        run: ./tests/check-assets.ps1
      - name: Check pinned Microsoft WebView2 system loader and ABI oracle
        shell: pwsh
        run: ./tests/check-webview-assets.ps1
      - name: Verify packaged engine sources, bytes and real ABI
        run: node tests/check-embedded-engine.mjs
      - name: Check Unicode sources and outline reference integrity
        shell: pwsh
        run: ./tests/check-ucd.ps1
      - name: Check Unicode generator reproducibility
        run: cargo run -p atelier-ucd-gen --locked --offline -- --ucd data/ucd/17.0.0 --output crates/unicode/src/generated.rs --check
      - name: Test Windows MSVC workspace
        run: cargo test --workspace --target x86_64-pc-windows-msvc --locked --offline
      - name: Run bounded deterministic parser fuzz campaign
        timeout-minutes: 5
        run: cargo run --release -p atelier-fuzz --locked --offline -- run --all --iterations 400 --seed 20261012 --timeout-ms 2000 --root target/fuzz-ci
      - name: Exercise native window without displaying it
        run: .\target\x86_64-pc-windows-msvc\debug\atelier.exe --self-check target\shell-check\window-state.txt
      - name: Exercise real WebView2; report open US-111 handle acceptance
        shell: pwsh
        run: ./tests/check-webview-host.ps1 -Executable ./target/x86_64-pc-windows-msvc/debug/atelier.exe -TargetDirectory target/webview-check -AllowKnownRuntimeHandleGrowth
      - name: Check embedded origin, real Worker and blocked requests
        shell: pwsh
        run: ./tests/check-embedded-resources.ps1 -Executable ./target/x86_64-pc-windows-msvc/debug/atelier.exe -TargetDirectory target/embedded-resources-debug
      - name: Build release native host
        run: cargo build -p atelier-desktop-win --release --locked --offline
      - name: Check release WebView2 DevTools; report handle acceptance
        shell: pwsh
        run: ./tests/check-webview-host.ps1 -Executable ./target/release/atelier.exe -TargetDirectory target/webview-release-check -AllowKnownRuntimeHandleGrowth
      - name: Check embedded resources in release
        shell: pwsh
        run: ./tests/check-embedded-resources.ps1 -Executable ./target/release/atelier.exe -TargetDirectory target/embedded-resources-release
      - name: Build Rust display-list oracle
        run: cargo build -p atelier-render --example display_list_oracle --locked --offline
      - name: Cross-check JavaScript display-list decoder
        run: node tests/display-list.mjs
      - name: Check real Canvas and textarea in headless Edge
        run: node tests/run-frontend-browser.mjs
      - name: Check the string catalog and hard-coded UI strings
        run: |
          node tests/i18n.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/check-i18n.mjs
      - name: Check themes and accessible UI in real Edge
        run: |
          node tests/theme.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/run-ui-browser.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/run-ui-browser.mjs --forced-colors
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked --offline -- -D warnings
      - name: Check symbol, context menu and About controls in Edge
        run: node tests/run-editor-utilities-browser.mjs
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Check SPDX headers
        run: cargo run --locked --offline -p atelier-check-license -- .

  wasm:
    name: WASM compile, lint and native engine tests
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust stable with Clippy
        run: rustup toolchain install stable --profile minimal --component clippy --target wasm32-unknown-unknown
      - name: Select Rust stable
        run: rustup default stable
      - name: Bootstrap workspace lock guard
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force target | Out-Null
          rustc --edition=2024 tools/check-workspace/src/main.rs -o target/check-workspace.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check workspace lock
        run: .\target\check-workspace.exe .
      - name: Compile WASM target
        run: cargo build -p atelier-core-wasm -p atelier-text-model -p atelier-unicode -p atelier-geom -p atelier-model -p atelier-compress -p atelier-render -p atelier-zip -p atelier-xml -p atelier-font -p atelier-image -p atelier-shape -p atelier-raster -p atelier-fmt-ooxml -p atelier-text-layout -p atelier-cfb -p atelier-fmt-legacy -p atelier-fmt-odf -p atelier-fmt-pdf --target wasm32-unknown-unknown --locked --offline
      - name: Lint WASM target
        run: cargo clippy -p atelier-core-wasm -p atelier-text-model -p atelier-unicode -p atelier-geom -p atelier-model -p atelier-compress -p atelier-render -p atelier-zip -p atelier-xml -p atelier-font -p atelier-image -p atelier-shape -p atelier-raster -p atelier-fmt-ooxml -p atelier-text-layout -p atelier-cfb -p atelier-fmt-legacy -p atelier-fmt-odf -p atelier-fmt-pdf --all-targets --target wasm32-unknown-unknown --locked --offline -- -D warnings
      - name: Test engine on native host
        run: cargo test -p atelier-core-wasm -p atelier-text-model -p atelier-unicode -p atelier-geom -p atelier-model -p atelier-compress -p atelier-render -p atelier-zip -p atelier-xml -p atelier-font -p atelier-image -p atelier-shape -p atelier-raster -p atelier-fmt-ooxml -p atelier-text-layout -p atelier-cfb -p atelier-fmt-legacy -p atelier-fmt-odf -p atelier-fmt-pdf --locked --offline
      - name: Build optimized WASM ABI
        run: cargo build -p atelier-core-wasm --profile wasm-release --target wasm32-unknown-unknown --locked --offline
      - name: Build isolated panic test hooks
        run: cargo build -p atelier-core-wasm --profile wasm-release --target wasm32-unknown-unknown --target-dir target/wasm-abi-hooks --features abi-test-hooks --locked --offline
      - name: Exercise ABI in Node and verify optimized size
        shell: pwsh
        run: |
          node tests/wasm-abi.mjs target/wasm32-unknown-unknown/wasm-release/atelier_core_wasm.wasm target/wasm-abi-hooks/wasm32-unknown-unknown/wasm-release/atelier_core_wasm.wasm
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/check-wasm-size.mjs target/wasm32-unknown-unknown/wasm-release/atelier_core_wasm.wasm
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test tests/check-wasm-size.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build native protocol oracle
        run: cargo build -p atelier-core-wasm --example protocol_oracle --locked --offline
      - name: Cross-check Rust and JavaScript protocol and real ABI transport
        run: node tests/wasm-protocol.mjs target/debug/examples/protocol_oracle.exe target/wasm32-unknown-unknown/wasm-release/atelier_core_wasm.wasm
      - name: Check exact protocol capacity boundary in JavaScript
        run: node tests/wasm-protocol-boundaries.mjs
      - name: Verify editor protocol and actual WASM rollback under ABI memory pressure
        run: |
          node tests/rich-editor-protocol.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/editor-page-cache.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/rich-editor-client.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/native-bridge-protocol.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/file-templates.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/rich-editor-abi.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/rich-editor-format.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/rich-editor-format-char.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/rich-editor-format-para.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/rich-editor-format-styles.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/format-key-router.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/rich-editor-format-para.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/rich-editor-save.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/rich-editor-selection.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/rich-editor-find.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/rich-editor-move.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/rich-editor-multidoc.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Exercise real Worker transfers and cancellation
        run: node tests/wasm-worker.mjs target/wasm32-unknown-unknown/wasm-release/atelier_core_wasm.wasm
      - name: Exercise default browser Worker bootstrap in headless Edge
        run: node tests/run-worker-browser.mjs
      - name: Check pointer capture, selection ordering and bounded auto-scroll
        run: node tests/mouse-selection.mjs
      - name: Check text drag/drop and automatic French spacing
        run: node --test tests/page-navigation.mjs tests/zoom.mjs tests/text-drag-drop.mjs tests/french-spacing.mjs tests/rich-preview-protocol.mjs
      - name: Exercise Canvas editor, composition and file adapter in headless Edge
        run: node tests/run-editor-browser.mjs
      - name: Insert images by picker, paste and drop in headless Edge
        run: |
          node tests/image-insert.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/run-image-insert-browser.mjs
      - name: Check the accessible document mirror and screen reader mode
        run: |
          node --test tests/document-mirror.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/run-document-mirror-browser.mjs
      - name: Check that glyph atlas pages render exactly like the per-glyph painter
        run: node tests/run-rich-atlas-render-browser.mjs
      - name: Exercise the rich editor (the only editor since R8)
        run: |
          node --test tests/rich-editor-unit.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/run-rich-editor-ui-browser.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/run-file-tab-ui-browser.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/run-rich-editor-format-para-browser.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/run-format-char-browser.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/run-styles-browser.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/run-document-tabs-browser.mjs

  linux-musl:
    name: Linux musl build and tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust stable target
        run: rustup toolchain install stable --profile minimal --target x86_64-unknown-linux-musl
      - name: Select Rust stable
        run: rustup default stable
      - name: Update apt package index
        run: sudo apt-get update
      - name: Install musl linker
        run: sudo apt-get install --yes musl-tools
      - name: Bootstrap workspace lock guard
        run: |
          mkdir -p target
          rustc --edition=2024 tools/check-workspace/src/main.rs -o target/check-workspace
      - name: Check workspace lock
        run: ./target/check-workspace .
      - name: Build Linux musl packages
        run: cargo build --workspace --exclude atelier-desktop-win --exclude atelier-core-wasm --target x86_64-unknown-linux-musl --locked --offline
      - name: Test Linux musl packages
        run: cargo test --workspace --exclude atelier-desktop-win --exclude atelier-core-wasm --target x86_64-unknown-linux-musl --locked --offline
