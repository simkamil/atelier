name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows MSVC, tests and quality
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust stable components
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy --target x86_64-pc-windows-msvc
      - name: Select Rust stable
        run: rustup default stable
      - name: Bootstrap workspace lock guard
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force target | Out-Null
          rustc --edition=2024 tools/check-workspace/src/main.rs -o target/check-workspace.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check workspace lock
        run: .\target\check-workspace.exe .
      - name: Build Windows MSVC workspace
        run: cargo build --workspace --target x86_64-pc-windows-msvc --locked --offline
      - name: Check font and image resource integrity
        shell: pwsh
        run: ./tests/check-assets.ps1
      - name: Check Unicode sources and outline reference integrity
        shell: pwsh
        run: ./tests/check-ucd.ps1
      - name: Check Unicode generator reproducibility
        run: cargo run -p atelier-ucd-gen --locked --offline -- --ucd data/ucd/17.0.0 --output crates/unicode/src/generated.rs --check
      - name: Test Windows MSVC workspace
        run: cargo test --workspace --target x86_64-pc-windows-msvc --locked --offline
      - name: Exercise native window without displaying it
        run: .\target\x86_64-pc-windows-msvc\debug\atelier.exe --self-check target\shell-check\window-state.txt
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked --offline -- -D warnings
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Check SPDX headers
        run: cargo run --locked --offline -p atelier-check-license -- .

  wasm:
    name: WASM compile, lint and native engine tests
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust stable with Clippy
        run: rustup toolchain install stable --profile minimal --component clippy --target wasm32-unknown-unknown
      - name: Select Rust stable
        run: rustup default stable
      - name: Bootstrap workspace lock guard
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force target | Out-Null
          rustc --edition=2024 tools/check-workspace/src/main.rs -o target/check-workspace.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check workspace lock
        run: .\target\check-workspace.exe .
      - name: Compile WASM target
        run: cargo build -p atelier-core-wasm -p atelier-unicode -p atelier-geom -p atelier-model -p atelier-compress -p atelier-render -p atelier-zip -p atelier-xml -p atelier-font -p atelier-image -p atelier-shape --target wasm32-unknown-unknown --locked --offline
      - name: Lint WASM target
        run: cargo clippy -p atelier-core-wasm -p atelier-unicode -p atelier-geom -p atelier-model -p atelier-compress -p atelier-render -p atelier-zip -p atelier-xml -p atelier-font -p atelier-image -p atelier-shape --all-targets --target wasm32-unknown-unknown --locked --offline -- -D warnings
      - name: Test engine on native host
        run: cargo test -p atelier-core-wasm -p atelier-unicode -p atelier-geom -p atelier-model -p atelier-compress -p atelier-render -p atelier-zip -p atelier-xml -p atelier-font -p atelier-image -p atelier-shape --locked --offline
      - name: Build optimized WASM ABI
        run: cargo build -p atelier-core-wasm --profile wasm-release --target wasm32-unknown-unknown --locked --offline
      - name: Build isolated panic test hooks
        run: cargo build -p atelier-core-wasm --profile wasm-release --target wasm32-unknown-unknown --target-dir target/wasm-abi-hooks --features abi-test-hooks --locked --offline
      - name: Exercise ABI in Node and verify optimized size
        shell: pwsh
        run: |
          node tests/wasm-abi.mjs target/wasm32-unknown-unknown/wasm-release/atelier_core_wasm.wasm target/wasm-abi-hooks/wasm32-unknown-unknown/wasm-release/atelier_core_wasm.wasm
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/check-wasm-size.mjs target/wasm32-unknown-unknown/wasm-release/atelier_core_wasm.wasm
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build native protocol oracle
        run: cargo build -p atelier-core-wasm --example protocol_oracle --locked --offline
      - name: Cross-check Rust and JavaScript protocol and real ABI transport
        run: node tests/wasm-protocol.mjs target/debug/examples/protocol_oracle.exe target/wasm32-unknown-unknown/wasm-release/atelier_core_wasm.wasm
      - name: Check exact protocol capacity boundary in JavaScript
        run: node tests/wasm-protocol-boundaries.mjs
      - name: Exercise real Worker transfers and cancellation
        run: node tests/wasm-worker.mjs target/wasm32-unknown-unknown/wasm-release/atelier_core_wasm.wasm
      - name: Exercise default browser Worker bootstrap in headless Edge
        run: node tests/run-worker-browser.mjs

  linux-musl:
    name: Linux musl build and tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust stable target
        run: rustup toolchain install stable --profile minimal --target x86_64-unknown-linux-musl
      - name: Select Rust stable
        run: rustup default stable
      - name: Update apt package index
        run: sudo apt-get update
      - name: Install musl linker
        run: sudo apt-get install --yes musl-tools
      - name: Bootstrap workspace lock guard
        run: |
          mkdir -p target
          rustc --edition=2024 tools/check-workspace/src/main.rs -o target/check-workspace
      - name: Check workspace lock
        run: ./target/check-workspace .
      - name: Build Linux musl packages
        run: cargo build --workspace --exclude atelier-desktop-win --exclude atelier-core-wasm --target x86_64-unknown-linux-musl --locked --offline
      - name: Test Linux musl packages
        run: cargo test --workspace --exclude atelier-desktop-win --exclude atelier-core-wasm --target x86_64-unknown-linux-musl --locked --offline
