<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Canvas renderer checks</title>
<pre id="result">Running Canvas checks…</pre>
<script type="module">
  import { runCanvasChecks } from "./canvas-browser.mjs";
  const result = document.querySelector("#result");
  try {
    const checks = await runCanvasChecks();
    result.textContent = JSON.stringify({ status: "passed", checks }, null, 2);
    window.canvasChecks = checks;
  } catch (error) {
    result.textContent = JSON.stringify({ status: "failed", error: String(error), stack: error.stack }, null, 2);
    window.canvasChecksError = String(error);
  }
</script>
</html>
