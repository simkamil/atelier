<html lang="fr">
<meta charset="utf-8">
<title>Validation de la saisie Atelier</title>
<h1>Validation de la saisie</h1>
<pre id="result" role="status">Exécution en cours…</pre>
<script type="module">
  import { runInputChecks } from "./input-browser.mjs";
  const result = document.querySelector("#result");
  try {
    result.textContent = JSON.stringify({ status: "passed", checks: await runInputChecks() }, null, 2);
  } catch (error) {
    result.textContent = JSON.stringify({ status: "failed", message: String(error) }, null, 2);
  }
</script>
</html>
